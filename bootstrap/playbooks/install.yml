---
- name: Prepare all nodes
  hosts: k8s_cluster
  become: true
  roles:
    - prereqs
    - containerd
    - kube_packages

- name: Initialize the first control plane
  hosts: control_plane[0]
  become: true
  roles:
    - kube_init
    - helm

- name: Join the other control planes
  hosts: control_plane[1:]
  become: true
  serial: 1
  roles:
    - kube_join

- name: Join the workers
  hosts: workers
  become: true
  roles:
    - kube_join

- name: Install the CNI
  hosts: control_plane[0]
  become: true
  roles:
    - cilium

- name: Wait for every node to be Ready
  hosts: control_plane[0]
  become: true
  gather_facts: false
  tasks:
    - name: Wait for the nodes
      ansible.builtin.command: kubectl --kubeconfig {{ kube_admin_conf }} wait --for=condition=Ready node --all --timeout=300s
      changed_when: false
