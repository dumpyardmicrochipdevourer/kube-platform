---
- name: Add the Kubernetes repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    uris: "https://pkgs.k8s.io/core:/stable:/{{ kube_minor }}/deb/"
    suites: /
    signed_by: "https://pkgs.k8s.io/core:/stable:/{{ kube_minor }}/deb/Release.key"
  register: kube_packages_repo

- name: Install the pinned Kubernetes packages
  ansible.builtin.apt:
    name:
      - "kubelet={{ kube_version }}-*"
      - "kubeadm={{ kube_version }}-*"
      - "kubectl={{ kube_version }}-*"
    state: present
    allow_downgrade: true
    allow_change_held_packages: true
    update_cache: true

- name: Hold the Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]

- name: Pin the kubelet node IP
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    content: "KUBELET_EXTRA_ARGS=--node-ip={{ kube_node_ip }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Enable kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
