---
- name: Name the snapshot
  ansible.builtin.set_fact:
    etcd_backup_name: "snapshot-{{ ansible_facts.date_time.iso8601_basic_short }}.db"

- name: Save an etcd snapshot inside the etcd pod
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig={{ kube_admin_conf }}
      - -n
      - kube-system
      - exec
      - "etcd-{{ ansible_facts.hostname | lower }}"
      - --
      - etcdctl
      - --endpoints=https://127.0.0.1:2379
      - --cacert=/etc/kubernetes/pki/etcd/ca.crt
      - --cert=/etc/kubernetes/pki/etcd/server.crt
      - --key=/etc/kubernetes/pki/etcd/server.key
      - snapshot
      - save
      - "/var/lib/etcd/{{ etcd_backup_name }}"
  changed_when: true

- name: Fetch the snapshot
  ansible.builtin.fetch:
    src: "/var/lib/etcd/{{ etcd_backup_name }}"
    dest: "{{ playbook_dir }}/../../backups/"
    flat: true

- name: Remove the snapshot from the node
  ansible.builtin.file:
    path: "/var/lib/etcd/{{ etcd_backup_name }}"
    state: absent
