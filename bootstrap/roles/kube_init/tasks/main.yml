---
- name: Deploy the kubeadm config
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    owner: root
    group: root
    mode: "0600"

- name: Initialize the first control plane
  ansible.builtin.command:
    cmd: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml --upload-certs
    creates: "{{ kube_admin_conf }}"

- name: Wait for the API server
  ansible.builtin.command: kubectl --kubeconfig {{ kube_admin_conf }} get --raw /readyz
  register: kube_init_ready
  until: kube_init_ready.stdout == 'ok'
  retries: 30
  delay: 5
  changed_when: false

- name: Fetch admin.conf for the operator
  ansible.builtin.fetch:
    src: "{{ kube_admin_conf }}"
    dest: "{{ playbook_dir }}/../../.kube/admin.conf"
    flat: true
  no_log: true

- name: Write the operator kubeconfig pointing at the forwarded API port
  ansible.builtin.copy:
    content: "{{ lookup('file', playbook_dir ~ '/../../.kube/admin.conf') | regex_replace('server: https://.*', 'server: https://127.0.0.1:6443') }}"
    dest: "{{ playbook_dir }}/../../.kube/config"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
