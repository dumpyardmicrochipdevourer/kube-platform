---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gpg
      - conntrack
      - socat
      - ebtables
      - ethtool
      - python3-debian
      - python3-kubernetes
      - python3-yaml
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Load kernel modules on boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: "0644"

- name: Load kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [overlay, br_netfilter]

- name: Set Kubernetes sysctls
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-kubernetes.conf
    state: present
    reload: true
  loop:
    - {key: net.bridge.bridge-nf-call-iptables, value: "1"}
    - {key: net.bridge.bridge-nf-call-ip6tables, value: "1"}
    - {key: net.ipv4.ip_forward, value: "1"}

- name: Turn swap off now
  ansible.builtin.command: swapoff -a
  when: ansible_facts.swaptotal_mb > 0
  changed_when: true

- name: Remove swap from fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'
