---
- name: Install Cilium
  kubernetes.core.helm:
    name: cilium
    chart_ref: cilium
    chart_repo_url: https://helm.cilium.io
    chart_version: "{{ cilium_version }}"
    release_namespace: kube-system
    kubeconfig: "{{ kube_admin_conf }}"
    wait: true
    timeout: 15m
    values:
      kubeProxyReplacement: true
      k8sServiceHost: "{{ kube_api_address }}"
      k8sServicePort: 6443
      ipam:
        mode: kubernetes
      operator:
        replicas: "{{ [groups['k8s_cluster'] | length, 2] | min }}"
